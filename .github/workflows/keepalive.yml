name: Keep Render instance awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        run: |
          curl -sS -o /dev/null -w "status: %{http_code}\n" https://telegram-data-analyst-bot-cehs.onrender.com/
